# FlowPilot behind Traefik: Traefik terminates TLS and forwards to port 8080.
# PHP requests go to the "app" service (PHP-FPM); everything else is static.

server {
    listen 8080;
    server_name _;

    # Resolve "app" through Docker's DNS on every request, so a redeployed app
    # container (with a new address) is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowpilot_app app:9000;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Static files get the headers PHP responses get from the application.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built assets have content hashes in their names, so they never change.
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Uploaded organization logos and profile pictures (the public disk).
    location /storage/ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /brand/ {
        try_files $uri =404;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Dotfiles (except ACME challenges) are never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass $flowpilot_app;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }
}
