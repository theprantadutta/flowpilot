; FlowPilot PHP-FPM pool, applied on top of the image's "www" pool.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000

; Sized for a small server: each child takes roughly 40-80 MB. Raise
; FPM_MAX_CHILDREN in the environment for more concurrent requests.
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; nginx logs requests; FPM only reports problems.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

request_terminate_timeout = 120s
