; FlowPilot production PHP settings (loaded after the image defaults).

expose_php = Off
memory_limit = 256M
max_execution_time = 60
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Attachments are capped at 20 MB by the application (config/flowpilot.php).
upload_max_filesize = 25M
post_max_size = 26M

; The code never changes inside a running container, so skip file checks.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.use_strict_mode = 1
date.timezone = UTC
